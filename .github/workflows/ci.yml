name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install dependencies
        run: just install

      - name: Check formatting (Prettier)
        run: just fmt-check

      - name: Run linter & typecheck (ESLint + tsc)
        run: just lint

  test:
    name: Node ${{ matrix.node-version }} (Build, Test & Conformance)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Verify Node & Go versions
        run: |
          node -v
          go version

      - name: Install dependencies
        run: just install

      - name: Build packages
        run: just build

      - name: Run unit, golden, and corpus tests
        run: just test

      - name: Run cross-language conformance suite
        run: just conformance
