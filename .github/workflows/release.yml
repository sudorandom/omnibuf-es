name: Release & Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Verify & Publish to npmjs.com
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Ensure latest npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: just install

      - name: Sync workspace package versions with release tag
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-}"
          VERSION="${RAW_TAG#v}"
          if [[ -n "$VERSION" && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Syncing package versions to $VERSION"
            node -e '
              const fs = require("node:fs");
              const version = process.argv[1];
              const files = [
                "package.json",
                "packages/omnibuf/package.json",
                "packages/omnibuf-node/package.json",
                "packages/omnibuf-web/package.json",
                "packages/protoc-gen-omnibuf-es/package.json",
              ];
              for (const file of files) {
                const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
                pkg.version = version;
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
              }
            ' "$VERSION"
          fi
          pnpm run fmt

      - name: Run full CI verification (format, lint, build, test, conformance)
        run: just ci

      - name: Pack & publish workspace packages to npmjs.com via npm OIDC
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-}"
          TAG_ARGS=()
          if [[ "$RAW_TAG" =~ -(alpha|beta|rc|next|stage) ]]; then
            TAG_ARGS=(--tag next)
          fi
          for pkg in packages/omnibuf packages/omnibuf-node packages/omnibuf-web packages/protoc-gen-omnibuf-es; do
            echo "Packing and publishing $pkg..."
            rm -f "$pkg"/*.tgz
            (cd "$pkg" && pnpm pack)
            tgz=$(ls "$pkg"/*.tgz | head -n 1)
            npm publish "$tgz" --access public --provenance "${TAG_ARGS[@]}"
            rm -f "$tgz"
          done
